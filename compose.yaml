name: classroom-devsecops
services:
  workspace-init:
    image: alpine:3.21
    user: root
    command: ["sh", "-c", "chown 1000:1000 /workspace"]
    volumes:
      - workspace:/workspace
  docker:
    image: docker:28-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-certs:/certs/client
      - docker-data:/var/lib/docker
      - workspace:/workspace
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30
  jenkins:
    build: ./infra/jenkins
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8000:8000"
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    volumes:
      - jenkins-home:/var/jenkins_home
      - docker-certs:/certs/client:ro
      - workspace:/workspace
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      docker:
        condition: service_healthy
volumes:
  jenkins-home:
  docker-certs:
  docker-data:
  workspace:
